<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/stylesheets/estilo.css">
</head>
<body>
  <h1>Login</h1>
  <form method="post" action="/login">
    <div>
      <label>Usuário: <input type="text" name="username" required></label>
    </div>
    <div>
      <label>Senha: <input type="password" name="password" required></label>
    </div>
    <div>
      <button type="submit">Entrar</button>
    </div>
  </form>
  <p><a href="/">Voltar ao Índice</a></p>
</body>
</html>
