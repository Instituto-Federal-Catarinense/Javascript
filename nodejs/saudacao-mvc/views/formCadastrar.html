<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário para cadastro de produtos</title>
</head>
<body>
     <h1>Informe as informações para cadastrar o produto:</h1>
  <form action="/produtos/cadastrar" method="POST">
    <label for="id">ID:</label>
    <input type="text" id="id" name="id" required><br><br>

    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" name="descricao" required><br><br>

     <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" name="quantidade" required><br><br>

    <label for="preco">Preço:</label>
    <input type="number" step="0.01" id="preco" name="preco" required><br><br>
    <button type="submit">Enviar</button>
</body>
</html>
